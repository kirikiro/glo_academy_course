<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>управление сотрудниками</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>управление сотрудниками</h1>
    <form id="employeeForm">
      <div>
        <label>имя: <input type="text" id="firstName" required /></label>
      </div>
      <div>
        <label>фамилия: <input type="text" id="lastName" required /></label>
      </div>
      <div>
        <label>возраст: <input type="number" id="age" required /></label>
      </div>
      <div>
        <label>должность: <input type="text" id="position" required /></label>
      </div>
      <div>
        <label
          >тип сотрудника:
          <select id="employeeType" required>
            <option value="">выберете</option>
            <option value="mechanic">слесарь</option>
            <option value="driver">водитель</option>
          </select>
        </label>
      </div>
      <div id="mechanicField" style="display: none">
        <label>разряд: <input type="number" id="grade" required /></label>
      </div>
      <div id="driverField" style="display: none">
        <label
          >категория прав:
          <select id="licenseCategory" required>
            <option value="">выберете</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
          </select>
        </label>
      </div>

      <button type="submit">сохранить</button>
    </form>

    <hr />
    <table id="employeeTable" border="1">
      <thead>
        <tr>
          <th>Имя</th>
          <th>Фамилия</th>
          <th>Возраст</th>
          <th>Должность</th>
          <th>Тип</th>
          <th>Доп. информация</th>
          <th>Удалить</th>
        </tr>
      </thead>
      <tbody id="employeeTableBody"></tbody>
    </table>
  </body>
</html>
