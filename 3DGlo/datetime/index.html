<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Текущая дата и время</title>
  </head>
  <body>
    <div class="datetime-block">
      <div class="greeting" id="greeting"></div>
      <div class="date-info">Сегодня: <span id="day-name"></span></div>
      <div class="time-info" id="current-time"></div>
      <div class="newyear-info">
        До нового года осталось <span id="days-left"></span> дней
      </div>
    </div>

    <script src="datetime.js"></script>
  </body>
</html>
